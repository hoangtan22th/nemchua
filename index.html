<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nệm Chúa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <!-- Header -->
  <header class="header-section" id="header"></header>

  <!-- Hero Slider -->
  <section class="hero-section" id="heroSlider"></section>

  <!-- Best Seller Section -->
  <section class="best-seller-section">
    <div class="container">
      <h2 class="section-title">Sản phẩm bán chạy</h2>
      <div class="product-grid" id="bestSellerGrid"></div>
    </div>
  </section>

  <!-- Middle Banner -->
  <section class="hero-2" id="hero2"></section>

  <!-- All Products Section -->
  <section class="products-section">
    <div class="container">
      <h2 class="section-title">Tất cả sản phẩm</h2>
      <div class="product-grid" id="allProductsGrid"></div>
    </div>
  </section>

  <!-- Banner Review -->
  <section class="banner-review">
    <div class="container">
      <div class="wrapper">
        <img src="./assets/images/BANER-GIOI-THIEU-DESKTOP.webp" alt="">
      </div>
    </div>
  </section>

  <!-- Video Reviews Section (Chia sẻ cảm nhận) -->
  <section class="video-reviews-section" id="videoReviews"></section>

  <!-- Press Section (Báo chí nói gì) -->
  <section class="press-section" id="pressSection"></section>

  <!-- Store System Section (Hệ thống cửa hàng) -->
  <section class="store-system-section" id="storeSystem"></section>

  <!-- Footer -->
  <footer class="site-footer" id="footer"></footer>

  <!-- Floating Chat -->
  <div class="floating-chat-btn">
    <i class="fa-solid fa-comment-dots"></i>
    <span>Liên hệ</span>
  </div>

  <!-- Scripts -->
  <script type="module" src="./js/pages/home.js"></script>
</body>

</html>
